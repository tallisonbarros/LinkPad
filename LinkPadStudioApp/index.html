<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkPad Studio</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #111;
      }

      #studio-boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #f2f1ed;
        background:
          linear-gradient(135deg, rgba(255, 122, 33, 0.08), transparent 32%),
          linear-gradient(315deg, rgba(15, 184, 164, 0.1), transparent 38%),
          #111;
        font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      .studio-boot-card {
        width: min(560px, 100%);
        min-height: 430px;
        padding: 26px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        background: #1d1d1f;
        border: 1px solid #3b3d41;
        border-radius: 8px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        box-sizing: border-box;
      }

      .studio-boot-brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .studio-boot-mark {
        width: 46px;
        height: 46px;
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        color: #111;
        background: #ff7a21;
        border-radius: 8px;
        font-weight: 900;
      }

      .studio-boot-brand strong {
        display: block;
        font-size: 26px;
      }

      .studio-boot-brand span {
        display: block;
        margin-top: 4px;
        color: #a7aaa9;
        font-size: 13px;
      }

      .studio-boot-progress {
        display: grid;
        flex: 1 1 auto;
        place-items: center;
        align-content: center;
        gap: 14px;
        color: #a7aaa9;
        font-size: 13px;
      }

      .studio-boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #303236;
        border-top-color: #ff7a21;
        border-radius: 50%;
        animation: studio-boot-spin 0.8s linear infinite;
      }

      @keyframes studio-boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .studio-boot-spinner { animation: none; border-top-color: #0fb8a4; }
      }
    </style>
  </head>
  <body>
    <div id="studio-boot" role="status" aria-busy="true" aria-live="polite">
      <section class="studio-boot-card" aria-label="Abrindo LinkPad Studio">
        <div class="studio-boot-brand">
          <div class="studio-boot-mark" aria-hidden="true">LP</div>
          <div>
            <strong>LinkPad Studio</strong>
            <span>Ambiente de engenharia para devices industriais LinkPad</span>
          </div>
        </div>
        <div class="studio-boot-progress">
          <div class="studio-boot-spinner" aria-hidden="true"></div>
          <span>Abrindo Studio...</span>
        </div>
      </section>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
