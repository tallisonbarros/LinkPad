[package]
name = "linkpad-studio"
version = "0.6.0"
description = "LinkPad Studio Windows desktop application"
authors = ["LinkPad"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serialport = "4.9"
sha2 = "0.10"
tar = "0.4"
