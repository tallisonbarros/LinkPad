name: LinkPad CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent / Python tests
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LinkPadAgenteApp
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: LinkPadAgenteApp/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  studio-ui:
    name: Studio / TypeScript and UI
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LinkPadStudioApp
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: LinkPadStudioApp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: TypeScript and Vite
        run: npm run check

  studio-rust:
    name: Studio / Rust backend
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LinkPadStudioApp/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rust versions
        run: |
          rustc --version
          cargo --version
      - name: Test
        run: cargo test --locked --quiet
