[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkpad-agent"
version = "0.2.0"
description = "Gateway HTTP/JSON do ecossistema LinkPad"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "python-snap7==3.0.0",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
windows = [
  "httpx>=0.27,<1",
  "PySide6>=6.8,<7",
  "pywin32>=308",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]
build = [
  "pyinstaller>=6.10,<7",
]

[project.scripts]
linkpad-agent = "linkpad_agent.service_main:console_main"
linkpad-agent-tray = "linkpad_agent.tray_main:main"
linkpad-agent-dev = "linkpad_agent.dev_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
